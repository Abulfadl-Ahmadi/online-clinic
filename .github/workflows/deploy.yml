name: Deploy Online Clinic Monorepo

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Execute Deployment Script on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Navigate to the monorepo root on the server
          cd /opt/online-clinic
          
          # 2. Pull the latest unified code
          git pull origin main
          
          # 3. Ensure environment files exist (copy templates if not present yet)
          [ ! -f frontend/.env.local ] && [ -f frontend/.env.example ] && cp frontend/.env.example frontend/.env.local || true
          [ ! -f backend/.env ] && [ -f backend/.env.example ] && cp backend/.env.example backend/.env || true
          
          # 4. Rebuild and start application containers
          docker compose -f docker-compose.yml up -d --build
          
          # 5. Force restart Celery to pick up any Django code changes safely
          docker compose -f docker-compose.yml restart celery_worker celery_beat
          
          # 6. Start / update monitoring stack (Prometheus, Grafana, Loki, Promtail, Node Exporter, cAdvisor)
          docker compose -f devops/docker-compose.monitoring.yml up -d
