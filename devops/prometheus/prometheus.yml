global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Host Metrics (CPU, RAM, Disk)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # Scrape Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Scrape Django Application Metrics (Optional: requires django-prometheus to be installed)
  # - job_name: 'django'
  #   static_configs:
  #     - targets: ['host.docker.internal:8000']
  #   metrics_path: '/metrics'
