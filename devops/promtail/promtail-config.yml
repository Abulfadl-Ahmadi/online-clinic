server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape all Docker container logs automatically
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

  # 2. Scrape Django Audit Logs (The advanced JSON log we created)
  - job_name: django_audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: django_audit
          __path__: /var/log/backend/audit/audit*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            logger: logger
            event: data.event
            trace_id: data.trace_id
            method: data.request.method
            path: data.request.path
            status: data.response.status_code
            ip: data.client.ip
      - labels:
          level:
          event:
          method:
          status:
      # Parse the timestamp from the JSON output so Loki uses the actual event time
      - timestamp:
          source: time
          format: "2006-01-02 15:04:05,000"
