# ------ Frontend Server ------
server {
    listen 80;
    server_name dr-rahimi-pt.ir www.dr-rahimi-pt.ir;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------ Backend Server (API) ------
server {
    listen 80;
    server_name api.dr-rahimi-pt.ir;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /opt/online-clinic/backend/media/;
    }

    location /static/ {
        alias /opt/online-clinic/backend/static/;
    }
}
