version: '3.8'

services:
  # -------------------------
  # Redis for Celery & Cache
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: online_clinic_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------
  # Django API Backend
  # -------------------------
  backend:
    build: ./backend
    container_name: online_clinic_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/media:/app/media
      - ./backend/static:/app/static
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Celery Worker
  # -------------------------
  celery_worker:
    build: ./backend
    container_name: online_clinic_celery_worker
    command: ["celery", "-A", "online_clinic_backend", "worker", "-l", "info"]
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Celery Beat (Scheduler)
  # -------------------------
  celery_beat:
    build: ./backend
    container_name: online_clinic_celery_beat
    command: ["celery", "-A", "online_clinic_backend", "beat", "-l", "info"]
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/logs:/app/logs
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Next.js Frontend
  # -------------------------
  frontend:
    build: ./frontend
    container_name: online_clinic_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
