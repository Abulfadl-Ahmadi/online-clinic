services:
  # -------------------------
  # Redis for Celery & Cache
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: online_clinic_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------
  # Django API Backend
  # -------------------------
  backend:
    image: ghcr.io/abulfadl-ahmadi/online-clinic-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: online_clinic_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/media:/app/media
      - ./backend/static:/app/static
      - ./backend/logs:/app/logs
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Celery Worker
  # -------------------------
  celery_worker:
    image: ghcr.io/abulfadl-ahmadi/online-clinic-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: online_clinic_celery_worker
    command: ["celery", "-A", "online_clinic_backend", "worker", "-l", "info"]
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Celery Beat (Scheduler)
  # -------------------------
  celery_beat:
    image: ghcr.io/abulfadl-ahmadi/online-clinic-backend:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: online_clinic_celery_beat
    command: ["celery", "-A", "online_clinic_backend", "beat", "-l", "info"]
    volumes:
      - ./backend/online_clinic_backend_db.sqlite3:/app/online_clinic_backend_db.sqlite3
      - ./backend/logs:/app/logs
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------
  # Next.js Frontend
  # -------------------------
  frontend:
    image: ghcr.io/abulfadl-ahmadi/online-clinic-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    container_name: online_clinic_frontend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/tmp:rw,noexec,nosuid,size=16m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
      - path: ./frontend/.env
        required: false
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  redis_data:
